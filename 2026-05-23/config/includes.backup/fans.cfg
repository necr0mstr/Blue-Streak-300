[temperature_fan _e_fan1]
pin: PB7
control: watermark
kick_start_time: 0.05
max_power: .750
min_temp: 0
max_temp: 75
max_delta: 3
target_temp: 60
shutdown_speed: 0.0
sensor_type: temperature_host

[temperature_fan _e_fan2]
pin: PB3
control: watermark
kick_start_time: 0.5
max_power: .750
min_temp: 0
max_temp: 75
max_delta: 3
target_temp: 60
shutdown_speed: 0.0
sensor_type: temperature_host

[heater_fan hotend_fan]
pin: !orbitoolO2S:PB15
tachometer_pin: orbitoolO2S:PB12
tachometer_ppr: 2
tachometer_poll_interval: 0.0005
heater: extruder
cycle_time: 0.0001 #10KHz PWM frecvency
heater_temp: 50
fan_speed: 1.0 # can be lowered to reduce fan noise
hardware_pwm: false
shutdown_speed: 0.0
max_power: 1.0 # can be lowered to reduce fan noise

[fan]
pin: orbitoolO2S:PB0
enable_pin: orbitoolO2S:PB14
tachometer_pin: orbitoolO2S:PA14
tachometer_ppr: 2
tachometer_poll_interval: 0.0005
shutdown_speed: 0.0
cycle_time: 0.00004 # 25KHz control PWM frequency
hardware_pwm: False
