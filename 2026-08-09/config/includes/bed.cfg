[heater_bed]
##  SSR Pin - HEATBED
##  Thermistor - TH1
heater_pin: PG11
sensor_type: Generic 3950
pullup_resistor: 4700
sensor_pin: dinghy:PA0

##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 1
min_temp: 0
max_temp: 115

control: pid
pid_Kp=62.395
pid_Ki=2.189
pid_Kd=444.563


[verify_heater heater_bed]
max_error: 240
check_gain_time: 60
hysteresis: 5
heating_gain: 2
